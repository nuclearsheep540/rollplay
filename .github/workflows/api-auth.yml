name: API Auth Tests

on:
  pull_request:
    paths:
      - 'api-auth/**'
  push:
    branches: [main]
    paths:
      - 'api-auth/**'

jobs:
  test-api-auth:
    name: Run api-auth tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install api-auth dependencies
        run: pip install -r api-auth/requirements.txt

      - name: Run tests
        env:
          JWT_SECRET_KEY: test-secret
          MAIL_TRAP_API_TOKEN: test-token
          NEXT_PUBLIC_API_URL: http://localhost:3000
          REDIS_URL: redis://localhost:6379
        run: cd api-auth && python -m pytest -v
