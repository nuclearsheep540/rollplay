version: 1
disable_existing_loggers: False
formatters:
  default:
    format: '%(asctime)s] %(levelname)s in %(module)s: %(message)s'
handlers:
  default:
    formatter: default
    class: logging.StreamHandler
    stream: ext://sys.stderr
  access:
    formatter: default
    class: logging.StreamHandler
    stream: ext://sys.stdout
loggers:
  uvicorn.error:
    level: INFO
    handlers:
      - default
    propagate: no
  uvicorn.access:
    level: INFO
    handlers:
      - access
    propagate: no
  # PyMongo 4.x emits structured DEBUG logs for every command, connection
  # checkout and server-selection round trip. Under our DEBUG root that is a
  # line per driver call on the hot path — far noisier, and more expensive,
  # than the per-message log we removed from the websocket loop. Pinned to
  # WARNING so real driver problems still surface.
  pymongo:
    level: WARNING
    handlers:
      - default
    propagate: no
root:
  level: DEBUG
  handlers:
    - default
  propagate: no