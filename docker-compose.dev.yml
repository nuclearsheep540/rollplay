version: "3.3"

services:
    nginx:
        build:
            context: ./docker/dev/nginx    # Adjusted context path
            dockerfile: Dockerfile         # Dockerfile is in the same folder
        container_name: "nginx-dev"
        ports:
        - "80:80"
        - "443:443"
        depends_on:
        - api-game
        - api-site
        - api-auth
        - app
        networks:
        - default
    
    api-game:
        hostname: api-game
        stdin_open: true
        tty: true
        env_file:
            - .env
        container_name: "api-game-dev"
        build:
            context: .
            dockerfile: docker/dev/api-game/Dockerfile
        ports:
            - 8081:8081
        volumes:
            - ./api-game:/api
            - ./rollplay-shared-contracts:/rollplay-shared-contracts
    
    api-site:
        hostname: api-site
        stdin_open: true
        tty: true
        env_file:
            - .env
        # Dev AWS wiring: map the .env DEV_* block onto the canonical names the app reads
        # (settings.py knows nothing about environments; `environment:` overrides env_file).
        # Prod compose keeps the unprefixed values — the compose file IS the env switch.
        environment:
            - AWS_CFD_S3_URL=${DEV_AWS_CFD_S3_URL}
            - CFD_PEM_FILENAME=${DEV_CFD_PEM_FILENAME}
            - CFD_KEY_PAIR_ID=${DEV_CFD_KEY_PAIR_ID}
            - S3_BUCKET_NAME=${DEV_S3_BUCKET_NAME}
            - AWS_REGION=${DEV_AWS_REGION}
            - AWS_ACCESS_KEY_ID=${DEV_AWS_ACCESS_KEY_ID}
            - AWS_SECRET_ACCESS_KEY=${DEV_AWS_SECRET_ACCESS_KEY}
            - PRESIGNED_URL_EXPIRY=${DEV_PRESIGNED_URL_EXPIRY}
        container_name: "api-site-dev"
        build:
            context: .
            dockerfile: docker/dev/api-site/Dockerfile
        ports:
            - 8082:8082
        volumes:
            - ./api-site:/api
            - ./rollplay-shared-contracts:/rollplay-shared-contracts
            # CloudFront signing key, read-only single file. Host ${HOME}/.ssh (per-box home) -> container /root/.ssh (container runs as root).
            - ${HOME}/.ssh/${CFD_PEM_FILENAME}:/root/.ssh/${CFD_PEM_FILENAME}:ro
        depends_on:
            postgres:
                condition: service_healthy

    api-auth:
        hostname: api-auth
        stdin_open: true
        tty: true
        env_file:
            - .env
        container_name: "api-auth-dev"
        build:
            context: ./api-auth
            dockerfile: Dockerfile
        ports: 
            - 8083:8083
        volumes:
            - ./api-auth:/app
        depends_on:
            - redis
    
    app:
        hostname: rollplay
        stdin_open: true
        tty: true
        env_file:
            - .env
        container_name: "rollplay-dev"
        build:
            context: ./rollplay
            dockerfile: ../docker/dev/rollplay/Dockerfile
            args:
                - NEXT_PUBLIC_SENTRY_DSN=${SENTRY_DSN_NEXTJS}
                - SENTRY_ORG=${SENTRY_ORG}
                - SENTRY_PROJECT=${SENTRY_PROJECT_NEXTJS}
                - SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}
        ports:
            - "3000:3000"
        volumes:
            - ./rollplay:/app
            - rollplay_node_modules:/app/node_modules
        environment:
            - NODE_ENV=development
            - NEXT_PUBLIC_SENTRY_DSN=${SENTRY_DSN_NEXTJS}
            - NEXT_PUBLIC_ENVIRONMENT=development
            - SENTRY_ORG=${SENTRY_ORG}
            - SENTRY_PROJECT=${SENTRY_PROJECT_NEXTJS}

    mongo:
        stdin_open: true
        tty: true
        restart: always
        env_file:
            - .env
        container_name: "mongo-dev"
        hostname: mongo
        build:
            context: ./docker
            dockerfile: dev/mongo/Dockerfile
            args:
                MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
                MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
        ports:
        - "27017:27017"
        volumes:
        - db_data:/data/db

    redis:
        image: redis:7-alpine
        container_name: "redis-dev"
        hostname: redis
        ports:
        - "6379:6379"
        command: redis-server --appendonly yes
        volumes:
        - redis_data:/data
        networks:
        - default

    postgres:
        container_name: "postgres-dev"
        hostname: postgres
        build:
            context: ./docker
            dockerfile: dev/postgres/Dockerfile
            args:
                POSTGRES_USER: ${POSTGRES_USER}
                POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                POSTGRES_DB: rollplay
                APP_DB_USER: ${APP_DB_USER}
                APP_DB_PASSWORD: ${APP_DB_PASSWORD}
        env_file:
            - .env
        environment:
            POSTGRES_DB: rollplay
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
        - "5432:5432"
        volumes:
        - postgres_data:/var/lib/postgresql/data
        networks:
        - default
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d rollplay"]
            interval: 5s
            timeout: 5s
            retries: 5

networks:
  default:
    driver: bridge

volumes:
  db_data:
  redis_data:
  postgres_data:
  rollplay_node_modules:
